[project]
name = "hpc-con"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "p-pawe-l", email = "pawelkozikowski58@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
hpc-con = "hpc_con:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.0",
    "pyfakefs>=6.2.0",
    "ruff>=0.16.10",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
# formatting is black's job
ignore = ["E501"]
